# Pulls Wikidata + Fandom into content/harvest (baked into the game). Run it from the Actions tab, or weekly.
name: Harvest
on:
  workflow_dispatch:
    inputs:
      only: { description: 'ids (comma) — empty = all', required: false, default: '' }
  schedule: [{ cron: '17 4 * * 1' }]
permissions: { contents: write }
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/harvest.ts
        timeout-minutes: 100 # then the commit step still saves what was done
        env: { ONLY: '${{ inputs.only }}' }
      # index.json is rebuilt after pulling, so several runs (ONLY=…) can work in parallel without conflicts
      - if: always()
        run: |
          git config user.name "harvest-bot"; git config user.email "harvest-bot@users.noreply.github.com"
          M=content/harvest/builtin-groups-map.json; cp $M /tmp/map.json 2>/dev/null || true
          git checkout -- content/harvest/index.json $M 2>/dev/null || true
          git add content/harvest
          git diff --cached --quiet || git commit -m "harvest: ${{ inputs.only || 'all' }}"
          for i in 1 2 3 4 5 6 7 8; do
            # a conflict on our harvest files (e.g. someone deleted one meanwhile): keep this run's version
            git pull --rebase origin main || { git add content/harvest && GIT_EDITOR=true git rebase --continue; } || { git rebase --abort; sleep 5; continue; }
            ONLY=index-only npx tsx scripts/harvest.ts && git add content/harvest/index.json
            # this run's built-in groups merged into the latest map (other runs may have added theirs)
            [ -f /tmp/map.json ] && node -e "const f=require('fs'),M='$M',a=f.existsSync(M)?JSON.parse(f.readFileSync(M)):{};Object.assign(a,JSON.parse(f.readFileSync('/tmp/map.json')));f.writeFileSync(M,JSON.stringify(a))" && git add $M
            IX=0; git diff --cached --quiet || { git commit -m "harvest: index"; IX=1; }
            git push && break
            # push lost the race: drop the index commit (rebuilt after the next pull), keep the data commit
            [ $IX = 1 ] && git reset -q --hard HEAD~1; sleep $((i * 10))
          done
